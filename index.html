<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pata Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* VIDEO BACKGROUND */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        #bgVideo video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
        }
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* MAIN CONTENT */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* RED BANNER - LIPA SASA */
        .banner {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            border-radius: 30px;
            padding: 40px 30px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(220, 38, 38, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 20px 60px rgba(220, 38, 38, 0.3); }
            50% { box-shadow: 0 20px 80px rgba(220, 38, 38, 0.6); }
            100% { box-shadow: 0 20px 60px rgba(220, 38, 38, 0.3); }
        }

        .banner .icon {
            font-size: 50px;
            color: #fbbf24;
            margin-bottom: 10px;
        }
        .banner h1 {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 4px;
        }
        .banner .sub {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }
        .banner .price {
            font-size: 48px;
            font-weight: 900;
            color: #fbbf24;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
        }
        .banner .price .currency {
            font-size: 24px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
        }

        .banner .btn-pay {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none;
            border-radius: 16px;
            color: #0f172a;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(251, 191, 36, 0.3);
        }
        .banner .btn-pay:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 40px rgba(251, 191, 36, 0.5);
        }
        .banner .btn-pay:active {
            transform: scale(0.96);
        }
        .banner .btn-pay i {
            font-size: 22px;
        }

        /* PHONE INPUT - inside banner */
        .phone-input-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            margin-bottom: 16px;
            transition: 0.3s;
        }
        .phone-input-group:focus-within {
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        }
        .phone-input-group .code {
            padding: 14px 4px 14px 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            font-weight: 600;
        }
        .phone-input-group input {
            flex: 1;
            padding: 14px 16px 14px 4px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .phone-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* SUCCESS MODAL */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: rgba(20, 27, 45, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: modalFade 0.4s ease;
        }
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-content .success-icon {
            font-size: 64px;
            color: #10b981;
            margin-bottom: 12px;
        }
        .modal-content h3 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .modal-content p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .modal-content .link-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px;
            word-break: break-all;
            margin-bottom: 16px;
        }
        .modal-content .link-box a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
        .modal-content .btn-close-modal {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 12px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }
        .modal-content .btn-close-modal:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* Loading state */
        .loading {
            display: none;
        }
        .loading.show {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .banner {
                padding: 30px 20px;
                border-radius: 24px;
            }
            .banner h1 {
                font-size: 24px;
            }
            .banner .price {
                font-size: 38px;
            }
            .banner .btn-pay {
                font-size: 18px;
                padding: 16px;
            }
            .modal-content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== VIDEO BACKGROUND ===== -->
    <div id="bgVideo">
        <video autoplay muted loop playsinline>
            <source src="https://files.catbox.moe/43mg06.mp4" type="video/mp4" />
        </video>
        <div class="bg-overlay"></div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container">
        <!-- RED BANNER -->
        <div class="banner">
            <div class="icon"><i class="fas fa-gift"></i></div>
            <h1>Pata Link Yako</h1>
            <p class="sub">WhatsApp Group ya wakubwa</p>

            <div class="price">
                <span class="currency">TSh</span> <span id="priceDisplay">5,000</span>
            </div>

            <form id="paymentForm">
                <div class="phone-input-group">
                    <span class="code">+255</span>
                    <input type="text" id="payPhone" required placeholder="712345678" />
                </div>
                <input type="hidden" id="payAmount" value="5000" />
                <input type="hidden" id="payDescription" value="WhatsApp Group Link" />
                <input type="hidden" id="payProductId" value="group_001" />

                <button type="submit" class="btn-pay" id="payBtn">
                    <i class="fas fa-bolt"></i> LIPA SASA
                    <span class="loading" id="loadingSpinner"><i class="fas fa-spinner"></i></span>
                </button>
            </form>
        </div>
    </div>

    <!-- ===== SUCCESS MODAL ===== -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="success-icon"><i class="fas fa-check-circle"></i></div>
            <h3>✅ Malipo Yamekamilika!</h3>
            <p>Link yako ya WhatsApp group iko tayari.</p>
            <div class="link-box">
                <a href="#" id="groupLink" target="_blank">https://chat.whatsapp.com/...</a>
            </div>
            <button class="btn-close-modal" onclick="closeSuccessModal()">
                <i class="fas fa-check"></i> Nenda Kwenye Group
            </button>
        </div>
    </div>

    <!-- ===== FIREBASE ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCvQGF9i7EAcUz72-1EriDJzc7Mcxvq-r0",
            authDomain: "pata-link-za-magroup-whatsapp.firebaseapp.com",
            projectId: "pata-link-za-magroup-whatsapp",
            storageBucket: "pata-link-za-magroup-whatsapp.firebasestorage.app",
            messagingSenderId: "603411167221",
            appId: "1:603411167221:web:67c1e724e1cc93299c92bc",
            measurementId: "G-RZJ0E92YF7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ===== LOAD PRICE FROM FIRESTORE =====
        async function loadPrice() {
            try {
                const snapshot = await getDocs(collection(db, "settings"));
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.price) {
                        document.getElementById('priceDisplay').textContent = data.price.toLocaleString();
                        document.getElementById('payAmount').value = data.price;
                    }
                    if (data.whatsappLink) {
                        document.getElementById('groupLink').href = data.whatsappLink;
                        document.getElementById('groupLink').textContent = data.whatsappLink;
                    }
                });
            } catch (e) {
                console.error("Error loading price:", e);
            }
        }
        loadPrice();

        // ===== PAYMENT FORM =====
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const phone = document.getElementById('payPhone').value.trim();
            const amount = document.getElementById('payAmount').value;
            const description = document.getElementById('payDescription').value;
            const btn = document.getElementById('payBtn');
            const spinner = document.getElementById('loadingSpinner');

            if (!phone || phone.length < 9) {
                alert('Tafadhali weka namba sahihi ya simu.');
                return;
            }

            // Full phone with +255
            let fullPhone = phone;
            if (!phone.startsWith('0') && !phone.startsWith('+')) {
                fullPhone = '0' + phone;
            }
            if (!phone.startsWith('+')) {
                fullPhone = '+255' + fullPhone.replace(/^0+/, '');
            }

            btn.disabled = true;
            spinner.classList.add('show');
            btn.querySelector('i.fa-bolt').style.display = 'none';
            btn.innerHTML = 'Inatuma... ';

            try {
                // Save order to Firestore
                const orderRef = await addDoc(collection(db, "orders"), {
                    phone: fullPhone,
                    amount: Number(amount),
                    description: description,
                    status: 'completed',
                    date: new Date().toISOString()
                });

                // Show success modal
                document.getElementById('successModal').classList.add('show');

                // Reset button
                btn.disabled = false;
                spinner.classList.remove('show');
                btn.innerHTML = '<i class="fas fa-bolt"></i> LIPA SASA';

                document.getElementById('payPhone').value = '';

            } catch (err) {
                alert('❌ Imeshindikana: ' + err.message);
                btn.disabled = false;
                spinner.classList.remove('show');
                btn.innerHTML = '<i class="fas fa-bolt"></i> LIPA SASA';
            }
        });

        // ===== CLOSE SUCCESS MODAL =====
        window.closeSuccessModal = function() {
            document.getElementById('successModal').classList.remove('show');
            // Open link in new tab
            const link = document.getElementById('groupLink').href;
            if (link && link !== '#') {
                window.open(link, '_blank');
            }
        };
    </script>
</body>
</html>
