<head>

    <style>
        /* CSS Styles for the Hero Look */
        :root {
            --primary-color: #2563eb; /* Modern Blue */
            --accent-color: #fbbf24; /* Amber/Gold */
            --text-color-dark: #1f2937;
            --text-color-light: #f3f4f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9fafb;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .hero {
            background: linear-gradient(to right, var(--primary-color), #1e40af);
            color: var(--text-color-light);
            padding: 100px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 1.5rem;
            margin-bottom: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .payment-section {
            background-color: var(--text-color-light);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            padding: 40px;
            max-width: 500px;
            margin: -60px auto 40px;
            position: relative;
        }

        .payment-section h2 {
            color: var(--primary-color);
            margin-top: 0;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color-dark);
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            font-size: 1.2rem;
            box-sizing: border-box; /* Important for padding */
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button.submit-btn {
            width: 100%;
            padding: 18px;
            background-color: var(--accent-color);
            color: var(--text-color-dark);
            border: none;
            border-radius: 10px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
        }

        button.submit-btn:hover {
            background-color: #f59e0b; /* Darker Amber */
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 5px;
        }
        
        .status-success { color: #166534; background-color: #dcfce7; }
        .status-error { color: #991b1b; background-color: #fee2e2; }

        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            background-color: var(--text-color-dark);
            color: var(--text-color-light);
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Tangaza Biashara Yako</h1>
        <p>Fikia maelfu ya wateja kwa bango kubwa la kuvutia. Lipa kwa urahisi kupitia simu yako.</p>
    </header>

    <main class="payment-section">
        <h2>LIPIA BANGO SASA</h2>
        <form id="paymentForm">
            <div class="form-group">
                <label for="phone">Namba yako ya Simu ya Mpesa/Tigo/Airtel:</label>
                <input type="text" id="phone" required placeholder="Mfano: 0712345678" pattern="[0-9]{10}" title="Tafadhali ingiza namba 10 za simu">
            </div>
            <button type="submit" class="submit-btn">Lipa</button>
        </form>
        <div id="status"></div>
    </main>

    <footer>
        <p>&copy; 2024 Bango Kubwa Services. Haki zote zimehifadhiwa.</p>
    </footer>

    <script>
        // Client-side logic to handle payment form submission
        const paymentForm = document.getElementById('paymentForm');
        const statusDiv = document.getElementById('status');

        paymentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            
            // Basic validation
            if (phone.length !== 10 || !/^\d+$/.test(phone)) {
                statusDiv.innerText = "Tafadhali ingiza namba halali ya simu yenye tarakimu 10.";
                statusDiv.className = 'status-error';
                return;
            }

            statusDiv.innerText = "Inachakata malipo... tafadhali subiri.";
            statusDiv.className = ''; // Clear previous classes

            try {
                const res = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();
                
                if (data.success) {
                    statusDiv.innerText = "Ombi la malipo limetumwa kwa simu yako. Tafadhali thibitisha kwa kuweka PIN.";
                    statusDiv.className = 'status-success';
                    paymentForm.reset(); // Reset form on success
                } else {
                     // Fallback error message
                    statusDiv.innerText = data.error || "Imeshindwa kuunganisha na mfumo wa malipo. Tafadhali jaribu tena.";
                    statusDiv.className = 'status-error';
                }
            } catch (error) {
                console.error('Payment error:', error);
                statusDiv.innerText = "Hitilafu ya mtandao. Tafadhali jaribu tena baadaye.";
                statusDiv.className = 'status-error';
            }
        });
    </script>
</body>
</html>
