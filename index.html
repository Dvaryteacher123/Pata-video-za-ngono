<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pata Link - Video na Malipo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        /* Sehemu ya Video */
        #videoContainer {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
            border-radius: 12px;
        }
        /* Box Jekundu la Malipo (Limefichwa mwanzo) */
        .payment-box {
            display: none;
            background: #d9534f; /* Rangi nyekundu */
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(217, 83, 79, 0.4);
            text-align: left;
            color: white;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .payment-box h2 { text-align: center; margin-top: 0; margin-bottom: 15px; }
        .price-tag {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .description-box {
            background: rgba(0,0,0,0.15);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        .btn-pay {
            background-color: #ffffff;
            color: #d9534f;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn-pay:hover { background-color: #f8f9fa; }
        #responseMsg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. Sehemu ya Video -->
        <div id="videoContainer">
            <video id="promoVideo" controls autoplay>
                <source src="https://www.image2url.com/r2/default/videos/1786461620011-1fc5c899-dd0f-4545-9779-ecd1d48e08b6.mp4" type="video/mp4">
                Browser yako haisomi video hii.
            </video>
        </div>

        <!-- 2. Box Jekundu la Malipo (Linaonekana video ikiisha) -->
        <div class="payment-box" id="paymentBox">
            <h2>Lipia Huduma</h2>
            
            <div class="price-tag" id="displayPrice">Inapakia bei...</div>
            <div class="description-box" id="displayDesc">Inapakia maelezo...</div>

            <div class="form-group">
                <label for="phone">Namba ya Simu:</label>
                <input type="text" id="phone" placeholder="Mfano: 0712345678">
            </div>

            <div class="form-group">
                <label for="network">Chagua Mtandao:</label>
                <select id="network">
                    <option value="Voda">Vodacom (M-Pesa)</option>
                    <option value="Airtel">Airtel Money</option>
                    <option value="Tigo">Tigo Pesa</option>
                </select>
            </div>

            <button class="btn-pay" onclick="makePayment()">Lipia Sasa</button>
            <p id="responseMsg"></p>
        </div>

    </div>

    <script>
        const video = document.getElementById('promoVideo');
        const paymentBox = document.getElementById('paymentBox');

        // Video ikiisha kucheza (ended)
        video.onended = function() {
            showPaymentSection();
        };

        // Kama mtumiaji akisimamisha au kubonyeza kuruka, unaweza pia kusubiri ikate au kuweka kitufe.
        // Hapa ikimaliza tu kucheza, video inajificha na box jekundu linatokea.
        function showPaymentSection() {
            document.getElementById('videoContainer').style.display = 'none';
            paymentBox.style.display = 'block';
            fetchPriceAndDesc(); // Chukua bei na maelezo kutoka database wakati box linatokea
        }

        // Chukua bei na maelezo kutoka server
        async function fetchPriceAndDesc() {
            try {
                const res = await fetch('/api/price');
                const data = await res.json();
                if (data.success && data.amount > 0) {
                    document.getElementById('displayPrice').textContent = `TZS ${data.amount}`;
                    document.getElementById('displayDesc').textContent = data.description || 'Hakuna maelezo ya ziada.';
                } else {
                    document.getElementById('displayPrice').textContent = 'Huduma haijapangiwa bei kwa sasa';
                    document.getElementById('displayDesc').textContent = '';
                }
            } catch (e) {
                document.getElementById('displayPrice').textContent = 'Imeshindwa kupakia bei';
            }
        }

        // Tuma ombi la malipo
        async function makePayment() {
            const phone = document.getElementById('phone').value;
            const msg = document.getElementById('responseMsg');

            if (!phone) {
                msg.style.color = 'yellow';
                msg.textContent = 'Tafadhali jaza namba ya simu!';
                return;
            }

            msg.style.color = 'white';
            msg.textContent = 'Inatuma ombi la malipo kwenye simu yako...';

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const result = await response.json();

                if (result.success || result.order_id) {
                    msg.style.color = '#d4edda';
                    msg.textContent = 'Tafadhali angalia simu yako uingize PIN ya malipo!';
                } else {
                    msg.style.color = '#ffc107';
                    msg.textContent = result.error || 'Imeshindwa kutuma ombi la malipo.';
                }
            } catch (error) {
                msg.style.color = '#ffc107';
                msg.textContent = 'Hitilafu ya mtandao.';
            }
        }
    </script>
</body>
</html>
