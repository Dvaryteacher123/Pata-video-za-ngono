<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pata Link - Video na Malipo</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }

        /* Video inajaza kioo kizima kwa nyuma (Background) */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Sehemu ya mbele inayoshikilia vitu juu ya video */
        .content-overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4); /* Inafanya video ionekane vizuri kwa giza kidogo */
        }

        /* Kitufe cha Play juu ya video ikiwa imesimama */
        #playOverlayBtn {
            position: absolute;
            z-index: 3;
            padding: 15px 30px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none; /* Inajificha mwanzo, itatokea video ikisimama */
        }

        /* Box Jekundu la Malipo (Limefichwa mwanzo) */
        .payment-box {
            display: none;
            background: #d9534f; /* Rangi nyekundu unayotaka */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 400px;
            color: white;
            animation: popIn 0.5s ease-in-out;
            z-index: 10;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .payment-box h2 { text-align: center; margin-top: 0; margin-bottom: 15px; }
        
        .price-tag {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            background: rgba(0,0,0,0.25);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .description-box {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.4;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .btn-pay {
            background-color: #ffffff;
            color: #d9534f;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn-pay:hover { background-color: #f8f9fa; }
        #responseMsg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. Video ya Background (Inajaza kioo kizima) -->
    <video id="bgVideo" autoplay playsinline>
        <source src="https://www.image2url.com/r2/default/videos/1786461620011-1fc5c899-dd0f-4545-9779-ecd1d48e08b6.mp4" type="video/mp4">
        Browser yako haisomi video hii.
    </video>

    <!-- Kitufe kitakachotokea ikiwa video imesimama/imeisha ili kuleta box la malipo -->
    <button id="playOverlayBtn" onclick="showPaymentBox()">Bonyeza Hapa Kulipia</button>

    <!-- 2. Sehemu ya Box Jekundu la Malipo -->
    <div class="content-overlay">
        <div class="payment-box" id="paymentBox">
            <h2>Lipia Huduma</h2>
            
            <!-- Bei inasomwa kutoka admin/database -->
            <div class="price-tag" id="displayPrice">Inapakia bei...</div>
            
            <!-- Maelezo yanayowekwa kule admin -->
            <div class="description-box" id="displayDesc">Inapakia maelezo...</div>

            <div class="form-group">
                <label for="phone">Namba ya Simu:</label>
                <input type="text" id="phone" placeholder="Mfano: 0712345678">
            </div>

            <div class="form-group">
                <label for="network">Chagua Mtandao:</label>
                <select id="network">
                    <option value="Voda">Vodacom (M-Pesa)</option>
                    <option value="Airtel">Airtel Money</option>
                    <option value="Tigo">Tigo Pesa</option>
                </select>
            </div>

            <button class="btn-pay" onclick="makePayment()">Lipia Sasa</button>
            <p id="responseMsg"></p>
        </div>
    </div>

    <script>
        const video = document.getElementById('bgVideo');
        const paymentBox = document.getElementById('paymentBox');
        const playBtn = document.getElementById('playOverlayBtn');

        // Video ikiisha au ikisimama (pause)
        video.onended = function() {
            triggerPaymentPrompt();
        };

        video.onpause = function() {
            // Kama haijamaliza lakini imesimama, tunaweza kuonyesha kitufe au box moja kwa moja
            if (!video.ended && video.currentTime > 0) {
                playBtn.style.display = 'block';
            }
        };

        function triggerPaymentPrompt() {
            playBtn.style.display = 'block';
        }

        // Mtumiaji akibonyeza kitufe cha kuendelea/kulipia
        function showPaymentBox() {
            video.style.display = 'none'; // Ficha video ya background
            playBtn.style.display = 'none'; // Ficha kitufe
            paymentBox.style.display = 'block'; // Onyesha box jekundu
            fetchPriceAndDesc(); // Vuta bei na maelezo ya hivi karibuni kutoka Admin/Firebase
        }

        // Kama video ikiisha yenyewe moja kwa moja bila kusimama
        video.addEventListener('ended', () => {
            video.style.display = 'none';
            paymentBox.style.display = 'block';
            fetchPriceAndDesc();
        });

        // 3. Kuchukua bei na maelezo kupitia API ya Server
        async function fetchPriceAndDesc() {
            try {
                const res = await fetch('/api/price');
                const data = await res.json();
                if (data.success && data.amount > 0) {
                    document.getElementById('displayPrice').textContent = `TZS ${data.amount}`;
                    document.getElementById('displayDesc').textContent = data.description || 'Hakuna maelezo ya ziada yaliyowekwa.';
                } else {
                    document.getElementById('displayPrice').textContent = 'Huduma haijapangiwa bei kwa sasa';
                    document.getElementById('displayDesc').textContent = 'Tafadhali subiri bei iwekwe.';
                }
            } catch (e) {
                document.getElementById('displayPrice').textContent = 'Imeshindwa kupakia bei';
            }
        }

        // 4. Kitendo cha kutuma ombi la malipo kwenda server
        async function makePayment() {
            const phone = document.getElementById('phone').value;
            const msg = document.getElementById('responseMsg');

            if (!phone) {
                msg.style.color = '#ffeb3b';
                msg.textContent = 'Tafadhali jaza namba ya simu!';
                return;
            }

            msg.style.color = '#ffffff';
            msg.textContent = 'Inatuma ombi la malipo kwenye simu yako...';

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const result = await response.json();

                if (result.success || result.order_id) {
                    msg.style.color = '#d4edda';
                    msg.textContent = 'Tafadhali angalia simu yako uingize PIN ya malipo!';
                } else {
                    msg.style.color = '#ffc107';
                    msg.textContent = result.error || 'Imeshindwa kutuma ombi la malipo.';
                }
            } catch (error) {
                msg.style.color = '#ffc107';
                msg.textContent = 'Hitilafu ya mtandao.';
            }
        }
    </script>
</body>
</html>
