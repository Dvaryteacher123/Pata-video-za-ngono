<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Dhibiti Bei</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .admin-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-save {
            background-color: #28a745;
            color: white;
        }
        .btn-save:hover {
            background-color: #218838;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>Usimamizi wa Bei</h2>
        <div class="form-group">
            <label for="priceInput">Weka Bei Mpya (TZS):</label>
            <input type="number" id="priceInput" placeholder="Mfano: 2000">
        </div>
        <div class="btn-container">
            <button class="btn-save" onclick="savePrice()">Hifadhi Bei</button>
            <button class="btn-delete" onclick="deletePrice()">Futa Bei</button>
        </div>
        <p id="message"></p>
    </div>

    <script>
        async function savePrice() {
            const amount = document.getElementById('priceInput').value;
            const msg = document.getElementById('message');

            if (!amount) {
                msg.style.color = 'red';
                msg.textContent = 'Tafadhali jaza kiasi cha bei!';
                return;
            }

            try {
                const response = await fetch('/api/admin/price', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: Number(amount) })
                });
                const data = await response.json();

                if (data.success) {
                    msg.style.color = 'green';
                    msg.textContent = 'Bei imehifadhiwa kikamilifu!';
                } else {
                    msg.style.color = 'red';
                    msg.textContent = 'Imeshindwa kuhifadhi bei.';
                }
            } catch (error) {
                msg.style.color = 'red';
                msg.textContent = 'Hitilafu ya mtandao.';
            }
        }

        async function deletePrice() {
            const msg = document.getElementById('message');
            
            try {
                // Tuma thamani ya 0 au futa kabisa kupitia API
                const response = await fetch('/api/admin/price', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: 0 })
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('priceInput').value = '';
                    msg.style.color = 'green';
                    msg.textContent = 'Bei imefutwa/kuwekwa sifuri!';
                } else {
                    msg.style.color = 'red';
                    msg.textContent = 'Imeshindwa kufuta bei.';
                }
            } catch (error) {
                msg.style.color = 'red';
                msg.textContent = 'Hitilafu ya mtandao.';
            }
        }
    </script>
</body>
</html>
